name: "DER Manager"
description: "Manages DER system configurations including PV, Battery, and EV systems"
version: "1.0.0"
capabilities:
  - "der_management"
  - "configuration"
supported_tools:
  - "der_config"
  - "flexibility_analyzer"
  - "system_query"
required_context:
  - "system_id"
  - "cluster_id"
  - "configuration_parameters"
model_preferences:
  model: "qwen3:1.7b"
  temperature: 0.3
  max_tokens: 2048
  system_prompt: "You are a DER management expert assistant. 
  Help users configure and optimize their distributed energy resources."
performance_metrics:
  avg_response_time: 2.5
  success_rate: 0.95
  max_concurrent_tasks: 5