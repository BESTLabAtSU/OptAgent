name: "Simulation Agent"
description: "Handles building and DER simulation tasks, manages scenario setup, and executes simulation workflows through integrated simulation tools."
version: "1.0.0"

capabilities:
  - "simulation_execution"
  - "result_analysis"

supported_tools:
  - "simulation_tool"

required_context:
  - "user_request"
  - "simulation_config"

model_preferences:
  model: "qwen3:1.7b"
  temperature: 0.25
  max_tokens: 2048
  system_prompt: |
    You are a simulation expert assistant.
    Your goal is to set up, execute, and interpret building and DER simulations.
    Always ensure configurations are complete, parameters are valid, and results are properly interpreted.
    Provide concise technical explanations and ensure computational efficiency and consistency.

performance_metrics:
  avg_response_time: 3.0
  success_rate: 0.93
  max_concurrent_tasks: 3
  supported_simulation_types:
    - "building_energy"
    - "hvac_system"
    - "der_operation"
    - "control_performance"
    - "grid_interaction"
  max_scenarios: 50
  max_simulations_per_scenario: 10
